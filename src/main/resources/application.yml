spring:
  application:
    name: sql-query-platform
  # 优雅停机：默认是 immediate —— SIGTERM 一来就**直接切断在途请求**
  # （进行中的 CSV 下载、正在跑的查询、最长 30 秒的 NL2SQL 调用全都会断在半路）。
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # ⚠️ 所有 @Scheduled 默认**共用 1 个线程**：任何一个卡住（等数据库、等 Broker）
  #    都会把补偿任务一起推迟 —— 而那两个补偿任务正是用来兜住"任务卡死"的。
  #
  # 4 → 6（第三轮）：定时任务从 5 处增加到 8 处，其中死信深度刷新（每 15 秒）
  #    和巡检**都会同步读一次 Broker**，Broker 不可达时要等 AMQP 应答超时。
  #    它们跑在调度线程上是**故意**的（比起让 Prometheus 抓取线程去等，宁可让调度线程等），
  #    但线程数必须跟着涨，否则新的定时任务会把两个补偿任务一起拖住。
  task:
    scheduling:
      pool:
        size: 6
  datasource:
    # ⚠️ connectTimeout / socketTimeout 都不能省：
    #    MySQL 驱动的默认值是 **0 = 永不超时**，而 Hikari 的 connection-timeout 只管"借连接"，
    #    管不了"借到之后语句卡住"。数据库 TCP 可达但不再响应时（磁盘满 / 机器假死 / 网络黑洞），
    #    execute() 会**永久阻塞**，把 Tomcat 线程一个个占死 —— 现象是"整个平台打不开"，
    #    而且 setQueryTimeout 也救不了（连接已经死了，KILL QUERY 发不出去）。
    url: jdbc:mysql://localhost:3306/sql_query_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=60000
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 显式写出来（原来全靠 Boot 默认值）：压测已经证明这个上限是 570 QPS 那个平台值的一部分，
      # 靠默认值意味着"这个数字从没被决定过"。
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # --- 可靠投递三件套，缺任何一个都等于没配 ---
    # ① 让 Broker 对每条消息回确认；correlated 表示确认会带上 CorrelationData.id，
    #    这样才能定位到"是哪条任务的消息没送到"
    publisher-confirm-type: correlated
    # ② 消息路由不到队列时退回给发送方，而不是静默丢弃
    publisher-returns: true
    template:
      # ③ 与 ② 配套：mandatory 不打开时，路由失败的消息连退回的机会都没有
      mandatory: true
    listener:
      simple:
        # 手动 ack：自动 ack 在方法返回时就确认，等于"不管里面发生了什么，消息都算处理了"
        acknowledge-mode: manual
        # 每个消费者一次只取一条：导出是重 IO 任务，预取会把它全堆在一个消费者手里，
        # 而其它消费者闲着 —— 也会让任务长时间停在 PENDING 被补偿任务误判
        prefetch: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 400ms
# 优雅停机。
# ⚠️ 默认是 immediate：SIGTERM 一来 Tomcat 就**直接切断在途请求** ——
#    进行中的 CSV 下载、正在跑的查询、最长 30 秒的 NL2SQL 调用会断在半路。
#    graceful 之后，容器停止时会先等这些请求跑完（上限见 spring.lifecycle.timeout-per-shutdown-phase）。
server:
  shutdown: graceful

# 接口文档（OpenAPI 3 + Swagger UI）
# 打开：http://localhost:8080/swagger-ui.html   ← 会跳到 /swagger-ui/index.html
# 原始 JSON：http://localhost:8080/v3/api-docs
#
# ⚠️ 安全边界：JwtInterceptor 只覆盖 /api/**，而上面这两个路径**不在这个范围里** ——
#    也就是说接口文档是**公开可访问**的。
#    它泄漏的是"接口的面貌"（路径、参数名、DTO 字段名、校验规则），**不是数据**：
#    真正的业务接口仍然要 JWT，没 token 一样调不通（Swagger UI 上的 Authorize 按钮就是干这个的）。
#    但接口面貌本身对攻击者有价值（省掉枚举和试错的成本），所以它做成**可关**的开关：
#    生产环境把 SPRINGDOC_ENABLED 设为 false 即可。
#    这与项目里其它默认值的取向一致 —— NL2SQL 默认关、DDL 默认谁都不给、监控端点只监听本机。
#
# ⚠️ 依赖版本必须跟着 Spring Boot 的大版本走：springdoc 3.x 面向 Boot 4，2.x 面向 Boot 3。
#    装错版本会在启动阶段以"Bean 创建失败 / 类找不到"的形式崩掉，而不是编译错误。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    # 接口与标签都按字母序，方便在几十个接口里找
    operations-sorter: alpha
    tags-sorter: alpha

# 监控端点
management:
  server:
    # 监控端点单独一个端口，而且只监听本机 —— 这是一个安全决定，不是配置习惯。
    # /actuator/** 里有 /env、/beans、/heapdump 这类能读到内部信息的端点，
    # 与业务接口放在同一个端口、同一个监听地址上，等于把它们一起暴露出去。
    # 需要跨机抓取时把 address 改成内网地址，并在前面放一层带鉴权的网关，
    # 而不是把它直接挂到公网。
    port: ${MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这四个。/env、/beans、/heapdump 之类默认就是关的，不要顺手打开
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 端口已经限制在本机，这里给出细节才能用于排障
      show-details: always
      group:
        # 存活探针只看进程本身：进程还在跑就算活着
        liveness:
          include: ping
        # 就绪探针只看平台自己的数据库。
        # 刻意「不」包含 Redis / RabbitMQ：本项目的设计取向是
        # Redis 挂掉时降级放行（见 RateLimitUtil / TokenBlacklistServiceImpl），
        # 如果把 Redis 算进就绪探针，负载均衡会因为一个"可以降级"的依赖
        # 把这个实例摘掉 —— 那等于把"降级可用"又变回了"不可用"。
        readiness:
          include: db

# 业务数据源（用户在页面上添加的那些库）的连接行为。
datasource:
  # MySQL 驱动解释时间字段所用的时区。
  #
  # ⚠️ 这个值不是"格式问题"：驱动靠它把库里的 TIMESTAMP/DATETIME 换算成时间对象，
  #    写死成 Asia/Shanghai 时，对接一个 UTC 的库会让**所有时间字段整体偏 8 小时**，
  #    而且不会报任何错。对接非国内时区的库时改这里。
  #    非法值（含 & 或 =，会被拼进连接串）只记 WARN 并沿用默认值，不会让应用起不来。
  mysql:
    server-timezone: ${MYSQL_SERVER_TIMEZONE:Asia/Shanghai}

  # 「测试连接」接口的限流。
  #
  # ⚠️ 这个接口会让服务器去连任意 host:port：一次调用最多占一个 Tomcat 线程 5 秒，
  #    而且它天然是一个端口探测面。能连出去的接口一定要有次数上限。
  test-connection:
    rate-limit:
      max-requests: 10
      window-seconds: 60

# 消息队列相关的运维配置
mq:
  # 死信队列巡检间隔。
  #
  # ⚠️ 为什么需要它：项目配了死信链路，但**没有任何消费者去读死信队列**，
  #    三个定时任务也都不查队列深度 —— 消息进了 DLQ 之后唯一的痕迹是一条 ERROR 日志。
  #    没有人翻日志的话，"有任务处理失败"这件事就是完全不可见的。
  #    DlqDepthMonitor 把两个 DLQ 的深度暴露成 mq_queue_depth{queue=...}，
  #    并在非空时打 ERROR。**它只负责"看得见"，不做自动重放** ——
  #    进了死信的消息对应的业务状态是未知的，自动重放等于把说不清状态的操作再执行一遍。
  dlq-check-cron: "0 */10 * * * ?"

  # 死信队列深度快照的刷新间隔。
  #
  # ⚠️ 深度是**快照**，不是抓取时现查：Gauge 的 Supplier 跑在 Prometheus 抓取线程上，
  #    让它去等一次 AMQP 请求-应答，Broker 挂掉时会把整个 /actuator/prometheus 拖到超时 ——
  #    于是故障期间恰好丢掉全部指标。代价是最多滞后一个刷新周期，
  #    滞后本身由 mq_queue_depth_age_seconds 暴露出来。
  dlq-depth-refresh-ms: 15000

  # 队列容量。x-max-length / x-overflow 是**队列参数** ——
  # ⚠️ 给已存在的同名队列改这两个值，Broker 会报 PRECONDITION_FAILED (406)：
  #    升级时先 rabbitmqctl delete_queue export.queue review.queue，让应用重新声明。
  queue:
    max-length: 10000
    # 满了以后转投死信，而不是默认的 drop-head（drop-head 会丢队头那条最老的消息）
    overflow: reject-publish-dlx

  # 消费者重试策略。⚠️ 只作用于**导出链路**（只读 SQL）：
  #    工单链路执行的是 UPDATE，重跑等于再改一次数据，所以刻意不重试。
  consumer:
    retry:
      # 一次投递最多尝试几次（含第一次）。3 次 = 最多重试 2 次。
      # 只有"基础设施故障"（连不上库、写不回结果）才会走到重试；业务失败不会。
      max-attempts: 3
      # 第 n 次失败后等 n × 这个值（线性退避）→ 默认覆盖约 3 秒的故障窗口。
      # 等待期间消费者线程是被按住的（prefetch=1 且单消费者 = 这个队列停摆），
      # 所以别把它调得很大；要把窗口拉长应该加 TTL 延迟重试队列，把等待搬到 Broker 侧。
      backoff-ms: 1000

redis:
  # 数据源失效广播的订阅容器重试间隔。
  # 订阅容器刻意没有自动启动（自动启动会在容器刷新阶段同步连 Redis，
  # Redis 不可用时会把整个应用带崩，已实测），改由 RedisSubscriptionStarter
  # 在应用就绪后启动，失败就按这个间隔重试。
  subscriber-retry-ms: 30000

platform:
  # 管理员邀请码。注册时带上它才能拿到 ADMIN 角色。
  #
  # 留空（默认）= 关闭自助创建管理员，任何人都注册不出 ADMIN 账号。
  # ⚠️ 这是一个凭据，只从环境变量注入，不要写进配置文件、更不要提交进仓库。
  #
  # 为什么用邀请码而不是"把某个用户名写进配置"：后者可以被抢注 ——
  # 只要没人先注册那个名字，任何人都能注册它并直接拿到管理员权限。
  admin-register-code: ${ADMIN_REGISTER_CODE:}

  # 自然语言生成 SQL（NL2SQL）
  #
  # ⚠️ 默认关闭，而且必须由部署方显式打开。两个理由：
  #   1. 没配密钥就不该导致整个平台起不来 ——"接大模型"不能是硬依赖；
  #   2. 打开之后，**表结构会被发给模型服务**。这是一次真实的数据出境，
  #      必须有人为此签字，而不是应用擅自决定。
  #
  # 关闭时的表现是：入口明确返回"功能未启用，请配置 platform.llm.xxx"，
  # 而不是 500 或者空指针。见 DisabledLlmClient。
  #
  # 接口按 OpenAI 兼容协议（POST /chat/completions）调用，
  # 所以 DeepSeek / 通义 / Kimi / 本地 Ollama / vLLM 都只改 base-url 和 model 就能用。
  # 文旅、文物这类客户多半会要求模型私有化部署 —— 那时候要改的就是这一个 base-url。
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    # ⚠️ 这是一个凭据，只从环境变量注入，
    #    不要写进配置文件、更不要提交进仓库。
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    # 调用超时（秒）。必须有：这是一次同步的外部 HTTP 调用，占着 Web 线程。
    # 没有超时的话，上游卡住会把 Tomcat 线程池吃干，
    # 表现成"整个平台打不开"，而根因在别人家的服务上。
    timeout-seconds: 30

    # 单用户限流。比工单提交严得多：每一次都是一次**付费的外部调用**，
    # 而且最长会占用 30 秒的 Web 线程。不限流的话，一个人反复点
    # 就能把配额和线程一起烧掉。
    rate-limit:
      max-requests: 5
      window-seconds: 60

    # 并发上限（同时在跑的生成任务数）。**频率限制不能替代它**：
    # 频率限制管"一分钟点了几次"，管不住"此刻有几个请求还挂在模型调用上"。
    # 一次生成最长占 30 秒 Web 线程，只有频率限制时 5 次/分钟 = 5 个线程同时在等。
    #
    # ⚠️ 这是**单进程**的闸门：多实例部署时全局上限 = 实例数 × 这个值。
    max-concurrent: 4
    # 拿不到额度时最多等多久（毫秒）。NL2SQL 本身就是秒级操作，
    # 等一下再进去比直接被拒绝体验好；等不到才是真的该拒绝。
    acquire-timeout-ms: 2000

  # 查询的并发闸门（注意：这是**并发**限制，不是速率限制）
  #
  # ⚠️ 它和上面的 query.rate-limit 是两件事，别混：
  #   rate-limit  拦的是"单位时间内的次数"（脚本刷接口）
  #   query-load  拦的是"同一时刻在处理几个"（开 20 个标签页同时点）
  # "每分钟 60 次"完全挡不住瞬时并发 —— 60 次可以在一秒内全打出去，
  # 而那时候它们会一起去抢连接池（每个业务数据源只有 5 个连接）。
  query-load:
    # 每个数据源同时允许多少个查询在执行。
    # 默认取 ConnectionManager.MAX_POOL_SIZE（5）—— 理由是闸门的意义在于
    # "在碰到数据库之前就拒绝"，而不是"让请求去连接池门口排 10 秒的队"。
    # ⚠️ 调成大于池上限时，多出来的并发仍会在 getConnection() 上等待，闸门形同虚设
    #    （启动时会打 WARN 提醒）。
    per-data-source-concurrency: ${QUERY_PER_DATASOURCE_CONCURRENCY:5}
    # 同一个人同时允许多少个查询在执行。默认 3 ——
    # 正常使用不会同时开三个查询；开到 3 说明要么在对比结果，要么是脚本。
    per-user-concurrency: ${QUERY_PER_USER_CONCURRENCY:3}
    # 熔断器：用户填的数据源，它的可用性不由我们控制（机器可能关机、端口被挡）。
    # 不熔断的话，每一次查询都要走完"建连超时（5 秒）→ 失败"，
    # 而连接池只有 5 个连接 —— 一个连不上的库能把 Web 线程慢慢吃干。
    circuit-breaker:
      # 连续失败多少次就熔断。
      # ⚠️ 这个值**没有实测依据**，是按"5 个连接 × 一次失败"估的。
      # ⚠️ 只有"连接类"失败才计数（连不上 / 建连超时 / 池子拿不到连接）——
      #    "用户写错 SQL"不算，否则用户写错 5 次就能把整个数据源熔断。
      failure-threshold: ${QUERY_CIRCUIT_FAILURE_THRESHOLD:5}
      # 熔断后多久放一个请求去探测恢复。
      open-seconds: ${QUERY_CIRCUIT_OPEN_SECONDS:30}

    # ⚠️ 刻意**没有**"等待多久再放弃"这个配置：闸门是非阻塞的，拿不到就立刻拒绝。
    #    等待会把问题从"数据库连接不够"转移成"Web 线程被占着"，
    #    而 Web 线程是更大更贵的池子 —— 用大资源等小资源是排队的经典反模式。

  sql-permission:
    # 角色 -> 允许执行的语句类型。
    # 不配就用代码里的默认值（见 SqlPermissionProperties）：
    #   USER  = SELECT
    #   ADMIN = SELECT, INSERT, UPDATE, DELETE
    # DDL 默认不在任何角色里 —— DROP TABLE 这类语句在本平台没有正当用途，
    # 要开必须在这里显式配置，而不是"因为是管理员所以顺手给了"。
    #
    # 配了这里就会**整体替换**默认值，不是合并：写少一个角色，
    # 那个角色的用户会立刻变成"什么都不能执行"（fail-closed）。
    #
    # role-whitelist:
    #   USER:  [SELECT]
    #   ADMIN: [SELECT, INSERT, UPDATE, DELETE]

    # 可以提交审核工单去申请执行的语句类型。
    #
    # ⚠️ 它**必须**和上面的 role-whitelist 分开，这是工单能不能成立的关键。
    # 直觉上会想"提交工单也用同一个白名单"，但那样会得到一个死循环：
    # USER 的白名单里只有 SELECT，于是 USER 连一条 UPDATE 的工单都提交不了 ——
    # 而"让没有写权限的人能够申请写操作"正是工单系统存在的理由。
    #
    # 三件事的边界：
    #   能不能申请      -> reviewable-types（这里），默认 INSERT / UPDATE / DELETE
    #   能不能直接执行  -> role-whitelist，走 QueryServiceImpl，与工单无关
    #   批了能不能执行  -> 由"审批人点了通过"授予，一次性、绑定到这一条 SQL 上
    #
    # DDL 默认不在里面，理由和 role-whitelist 一样：
    # DROP / TRUNCATE 不是"数据订正"，是结构变更，没有"审一下就能放行"的正当场景。
    #
    # 放宽的只是语句类型 —— 解析、AST 危险函数检查、系统库检查、字符串兜底
    # 这四道防线在提交和执行两处都不会少：可申请的是"写语句"，不是"危险语句"。
    #
    # reviewable-types: [INSERT, UPDATE, DELETE]

query:
  rate-limit:
    # 单用户每分钟允许执行的查询条数。
    # 原来写死 10 —— 实测会拦住正常使用（反复调试同一条 SQL 几十秒就会触顶），
    # 安全措施反而变成了功能故障。改成可配，默认放宽到 60。
    max-requests: 60
    window-seconds: 60

# 导出相关策略
export:
  # 超过保留天数的 CSV 会被定时任务删除，并把数据库里的路径置空
  file-retention-days: 7
  clean-cron: "0 0 3 * * ?"
  # 单次导出的行数上限。超过就直接让任务失败，而不是截断后返回成功 ——
  # 截断的 CSV 看起来是"完整的"，用户会以为数据齐了；报错至少让他知道要缩小范围。
  # 这个值必须存在：没有上限时，一条 select * from 大表 会把磁盘写满，
  # 而磁盘写满影响的是整台机器上的所有服务。
  max-rows: 100000

  # 单条导出 SQL 的执行超时（秒）。
  # 比查询链路的 30 秒宽（导出还要往磁盘写），但必须有 ——
  # 导出连接来自和查询共用的连接池（上限 5），一条挂住的慢 SQL 会把池子慢慢占满。
  query-timeout-seconds: 300

  # 超过这个时长还停在 PENDING / RUNNING 的任务会被补偿任务标记为失败。
  #
  # ⚠️ 两种卡死看的**不是同一个时间列**（见 migrate_004）：
  #    RUNNING → started_at（**认领时刻**）—— 只关心"执行了多久"
  #    PENDING → created_at（创建时刻）  —— 关心"提交后多久还没被认领"
  #
  #    以前两者都用 created_at，于是 RUNNING 的判定把**排队时间**也算进去了：
  #    队列积压时「排队 6 分钟 + 执行 5 分钟」的正常任务会被判成卡死，
  #    补偿任务标 FAILED，消费者随后又写回 SUCCESS ——
  #    用户看到"导出成功"却配着一句失败原因。
  #
  # ⚠️ 加了 started_at 之后，这个阈值和 query-timeout-seconds 的约束更直接了：
  #    阈值只需要覆盖"执行上限 + 余量"，**不再需要为排队留余量**。
  #    300 秒执行 + 300 秒余量 = 600 秒（保持原值不变，但含义收紧了）。
  #    调大 query-timeout-seconds 时仍必须同步调大这个值。
  stuck-running-minutes: 10
  recovery-cron: "0 */5 * * * ?"

# SQL 审核工单（审批通过后异步执行的那条链路）
review:
  # 单条工单 SQL 的执行超时（秒）。
  # 比查询链路的 30 秒宽 —— 工单本来就是给"批量订正"用的；
  # 但必须有：它和查询共用同一个数据源连接池（上限 5），
  # 一条挂住的 UPDATE 会把池子慢慢占满，把正常查询一起拖垮。
  query-timeout-seconds: 120

  # 工单写语句的「前镜像 + 反向 SQL」留存上限（G/L6）。
  # 超过这个行数就记一条 SKIPPED（语句照常执行，只是这次没有回滚依据）。
  # ⚠️ 为什么要有上限：把 10 万行塞进 JSON 会把平台库自己撑爆。
  #    而且到了几百行以上，反向 SQL 本身也不再是「人能核对」的东西 ——
  #    那时候正确的工具是备份恢复，不是这个功能。
  undo:
    max-rows: 200

  # 批准之后多久还没被执行，就重新投递一次执行消息。
  #
  # 为什么可以放心重投：消费者认领时要求状态仍是 APPROVED（条件更新），
  # 第一条消息认领成功后，后面重复的那些只会被 ack 掉，不会重复执行。
  # 这也正是 approve() 里"投递失败不报错、交给补偿任务"这个决定能成立的前提 ——
  # 没有这个兜底，那条被吞掉的异常就真的没人管了。
  stuck-approved-minutes: 10

  # 重投最多持续多久，超过就放弃并标记失败。
  # 没有这个上限的话，Broker 长期不可用会让补偿任务每 5 分钟重投一次、
  # 永远重投下去 —— 日志被刷满，却没有任何人注意到。
  stuck-approved-max-hours: 24

  # EXECUTING 停留超过这个时长就认定执行中断。
  # ⚠️ 它必须明显大于 query-timeout-seconds：
  #     2 分钟执行上限 + 13 分钟余量 = 15 分钟。
  #     调大 query-timeout-seconds 时必须同步调大这个值，
  #     否则会把仍在正常执行的工单判成失败。
  #
  # 卡在这一步的工单会被标记为失败，而**不会**自动重跑 ——
  # 写语句不幂等（UPDATE ... SET n = n + 1 跑两次就是两次），
  # 中断时"到底生效没有"无法确定。这个不确定性必须交给人，不能用一个"重试"消化掉。
  stuck-executing-minutes: 15

  recovery-cron: "0 */5 * * * ?"

  # 是否允许审批自己提交的工单。默认不允许。
  #
  # 这条链路存在的理由就是"由另一个人看过之后决定"，而它偏偏是全平台
  # 唯一一条执行人工写语句的路径。允许自批的话，对 ADMIN 来说工单就退化成了
  # 一次自我确认 —— 审批这一步就白设了。
  #
  # 但只有一名管理员的小团队确实需要放开，所以做成配置而不是写死。
  # 注意：驳回**不**受这个开关限制 —— 驳回自己的工单本质上就是「撤回」，
  # 禁止它只会让人被自己卡住，一条提错了的工单再也撤不掉。
  allow-self-approve: ${REVIEW_ALLOW_SELF_APPROVE:false}

  # 提交工单的单用户限流。
  # 比查询的 60 次/分钟更严：每提交一次，平台就会拿**业务库**的连接跑一次 EXPLAIN，
  # 而那个连接池上限只有 5。任意登录用户无成本连点，既能把别人的查询连接池占满，
  # 又能往工单表里灌垃圾。"谁都能申请"是对的（申请不改数据），
  # 但"谁都能无限量申请"不是。
  rate-limit:
    max-requests: 20
    window-seconds: 60
jwt:
  
  secret: ${JWT_SECRET}
  expire-days: 7
aes:
  # ---- 密钥版本化 ----
  # 密文格式：{版本号}:{Base64(...)}，例如 v2:xxxx
  # 加密永远用 current-key-version；解密按密文里带的版本号选密钥。
  #
  # 只配 key（不配 keys）时行为与改造前完全一致 —— 现有部署不需要改任何配置。
  current-key-version: ${AES_KEY_VERSION:v1}
  key: ${AES_KEY:}

  # 历史密钥：版本号 -> 密钥，只用于解密。
  # 轮换时把老密钥放这里，新密钥放上面的 key，再把 current-key-version 指到新版本：
  #   current-key-version: v2
  #   key: <新密钥>
  #   keys:
  #     v1: <老密钥>
  # 这样新数据用新密钥、老数据仍然解得开，轮换是可以分步做的。
  #
  # ⚠️ 不配 keys 时不要写 "keys: {}"。
  # 空的 flow map 会被 Spring Boot 摊平成「aes.keys="空字符串"」这一个属性，
  # 再往 Map<String,String> 字段上绑定时会直接报
  #   ConverterNotFoundException: No converter found capable of converting
  #   from type [java.lang.String] to type [java.util.Map]
  # 应用起不来。不写这一项即可 —— Java 字段本身就是空 Map。

  # 历史 ECB 密文（没有版本前缀的那种）用哪个版本的密钥解。
  # 本项目引入 GCM 时的密钥版本就是 v1，在那之前产生的密文用的也是同一个密钥。
  legacy-key-version: v1

  # 启动时把存量密码重新加密到当前版本。默认关闭 ——
  # 它会改写所有数据源密码，属于有破坏性的批量操作，应该由人显式触发。
  # 幂等：已经是当前版本的记录会被跳过，可以安全地重复执行。
  # 用法：轮换时临时置为 true 启动一次，确认日志里的迁移条数后改回 false。
  reencrypt-on-startup: ${AES_REENCRYPT_ON_STARTUP:false}

