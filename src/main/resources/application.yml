spring:
  application:
    name: sql-query-platform
  datasource:
    url: jdbc:mysql://localhost:3306/sql_query_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # --- 可靠投递三件套，缺任何一个都等于没配 ---
    # ① 让 Broker 对每条消息回确认；correlated 表示确认会带上 CorrelationData.id，
    #    这样才能定位到"是哪条任务的消息没送到"
    publisher-confirm-type: correlated
    # ② 消息路由不到队列时退回给发送方，而不是静默丢弃
    publisher-returns: true
    template:
      # ③ 与 ② 配套：mandatory 不打开时，路由失败的消息连退回的机会都没有
      mandatory: true
    listener:
      simple:
        # 手动 ack：自动 ack 在方法返回时就确认，等于"不管里面发生了什么，消息都算处理了"
        acknowledge-mode: manual
        # 每个消费者一次只取一条：导出是重 IO 任务，预取会把它全堆在一个消费者手里，
        # 而其它消费者闲着 —— 也会让任务长时间停在 PENDING 被补偿任务误判
        prefetch: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 400ms
# 监控端点
management:
  server:
    # 监控端点单独一个端口，而且只监听本机 —— 这是一个安全决定，不是配置习惯。
    # /actuator/** 里有 /env、/beans、/heapdump 这类能读到内部信息的端点，
    # 与业务接口放在同一个端口、同一个监听地址上，等于把它们一起暴露出去。
    # 需要跨机抓取时把 address 改成内网地址，并在前面放一层带鉴权的网关，
    # 而不是把它直接挂到公网。
    port: ${MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这四个。/env、/beans、/heapdump 之类默认就是关的，不要顺手打开
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 端口已经限制在本机，这里给出细节才能用于排障
      show-details: always
      group:
        # 存活探针只看进程本身：进程还在跑就算活着
        liveness:
          include: ping
        # 就绪探针只看平台自己的数据库。
        # 刻意「不」包含 Redis / RabbitMQ：本项目的设计取向是
        # Redis 挂掉时降级放行（见 RateLimitUtil / TokenBlacklistServiceImpl），
        # 如果把 Redis 算进就绪探针，负载均衡会因为一个"可以降级"的依赖
        # 把这个实例摘掉 —— 那等于把"降级可用"又变回了"不可用"。
        readiness:
          include: db

redis:
  # 数据源失效广播的订阅容器重试间隔。
  # 订阅容器刻意没有自动启动（自动启动会在容器刷新阶段同步连 Redis，
  # Redis 不可用时会把整个应用带崩，已实测），改由 RedisSubscriptionStarter
  # 在应用就绪后启动，失败就按这个间隔重试。
  subscriber-retry-ms: 30000

platform:
  # 管理员邀请码。注册时带上它才能拿到 ADMIN 角色。
  #
  # 留空（默认）= 关闭自助创建管理员，任何人都注册不出 ADMIN 账号。
  # ⚠️ 这是一个凭据，只从环境变量注入，不要写进配置文件、更不要提交进仓库。
  #
  # 为什么用邀请码而不是"把某个用户名写进配置"：后者可以被抢注 ——
  # 只要没人先注册那个名字，任何人都能注册它并直接拿到管理员权限。
  admin-register-code: ${ADMIN_REGISTER_CODE:}

  sql-permission:
    # 角色 -> 允许执行的语句类型。
    # 不配就用代码里的默认值（见 SqlPermissionProperties）：
    #   USER  = SELECT
    #   ADMIN = SELECT, INSERT, UPDATE, DELETE
    # DDL 默认不在任何角色里 —— DROP TABLE 这类语句在本平台没有正当用途，
    # 要开必须在这里显式配置，而不是"因为是管理员所以顺手给了"。
    #
    # 配了这里就会**整体替换**默认值，不是合并：写少一个角色，
    # 那个角色的用户会立刻变成"什么都不能执行"（fail-closed）。
    #
    # role-whitelist:
    #   USER:  [SELECT]
    #   ADMIN: [SELECT, INSERT, UPDATE, DELETE]

query:
  rate-limit:
    # 单用户每分钟允许执行的查询条数。
    # 原来写死 10 —— 实测会拦住正常使用（反复调试同一条 SQL 几十秒就会触顶），
    # 安全措施反而变成了功能故障。改成可配，默认放宽到 60。
    max-requests: 60
    window-seconds: 60

# 导出相关策略
export:
  # 超过保留天数的 CSV 会被定时任务删除，并把数据库里的路径置空
  file-retention-days: 7
  clean-cron: "0 0 3 * * ?"
  # 超过这个时长还停在 PENDING / RUNNING 的任务会被补偿任务标记为失败。
  # 卡的判定依据：单次导出的 SQL 超时是 30 秒，正常任务不可能超过 10 分钟
  stuck-running-minutes: 10
  recovery-cron: "0 */5 * * * ?"
jwt:
  
  secret: ${JWT_SECRET}
  expire-days: 7
aes:
  # ---- 密钥版本化 ----
  # 密文格式：{版本号}:{Base64(...)}，例如 v2:xxxx
  # 加密永远用 current-key-version；解密按密文里带的版本号选密钥。
  #
  # 只配 key（不配 keys）时行为与改造前完全一致 —— 现有部署不需要改任何配置。
  current-key-version: ${AES_KEY_VERSION:v1}
  key: ${AES_KEY:}

  # 历史密钥：版本号 -> 密钥，只用于解密。
  # 轮换时把老密钥放这里，新密钥放上面的 key，再把 current-key-version 指到新版本：
  #   current-key-version: v2
  #   key: <新密钥>
  #   keys:
  #     v1: <老密钥>
  # 这样新数据用新密钥、老数据仍然解得开，轮换是可以分步做的。
  #
  # ⚠️ 不配 keys 时不要写 "keys: {}"。
  # 空的 flow map 会被 Spring Boot 摊平成「aes.keys="空字符串"」这一个属性，
  # 再往 Map<String,String> 字段上绑定时会直接报
  #   ConverterNotFoundException: No converter found capable of converting
  #   from type [java.lang.String] to type [java.util.Map]
  # 应用起不来。不写这一项即可 —— Java 字段本身就是空 Map。

  # 历史 ECB 密文（没有版本前缀的那种）用哪个版本的密钥解。
  # 本项目引入 GCM 时的密钥版本就是 v1，在那之前产生的密文用的也是同一个密钥。
  legacy-key-version: v1

  # 启动时把存量密码重新加密到当前版本。默认关闭 ——
  # 它会改写所有数据源密码，属于有破坏性的批量操作，应该由人显式触发。
  # 幂等：已经是当前版本的记录会被跳过，可以安全地重复执行。
  # 用法：轮换时临时置为 true 启动一次，确认日志里的迁移条数后改回 false。
  reencrypt-on-startup: ${AES_REENCRYPT_ON_STARTUP:false}

