spring:
  application:
    name: sql-query-platform
  datasource:
    url: jdbc:mysql://localhost:3306/sql_query_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # --- 可靠投递三件套，缺任何一个都等于没配 ---
    # ① 让 Broker 对每条消息回确认；correlated 表示确认会带上 CorrelationData.id，
    #    这样才能定位到"是哪条任务的消息没送到"
    publisher-confirm-type: correlated
    # ② 消息路由不到队列时退回给发送方，而不是静默丢弃
    publisher-returns: true
    template:
      # ③ 与 ② 配套：mandatory 不打开时，路由失败的消息连退回的机会都没有
      mandatory: true
    listener:
      simple:
        # 手动 ack：自动 ack 在方法返回时就确认，等于"不管里面发生了什么，消息都算处理了"
        acknowledge-mode: manual
        # 每个消费者一次只取一条：导出是重 IO 任务，预取会把它全堆在一个消费者手里，
        # 而其它消费者闲着 —— 也会让任务长时间停在 PENDING 被补偿任务误判
        prefetch: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 400ms
# 监控端点
management:
  server:
    # 监控端点单独一个端口，而且只监听本机 —— 这是一个安全决定，不是配置习惯。
    # /actuator/** 里有 /env、/beans、/heapdump 这类能读到内部信息的端点，
    # 与业务接口放在同一个端口、同一个监听地址上，等于把它们一起暴露出去。
    # 需要跨机抓取时把 address 改成内网地址，并在前面放一层带鉴权的网关，
    # 而不是把它直接挂到公网。
    port: ${MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # 只开这四个。/env、/beans、/heapdump 之类默认就是关的，不要顺手打开
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 端口已经限制在本机，这里给出细节才能用于排障
      show-details: always
      group:
        # 存活探针只看进程本身：进程还在跑就算活着
        liveness:
          include: ping
        # 就绪探针只看平台自己的数据库。
        # 刻意「不」包含 Redis / RabbitMQ：本项目的设计取向是
        # Redis 挂掉时降级放行（见 RateLimitUtil / TokenBlacklistServiceImpl），
        # 如果把 Redis 算进就绪探针，负载均衡会因为一个"可以降级"的依赖
        # 把这个实例摘掉 —— 那等于把"降级可用"又变回了"不可用"。
        readiness:
          include: db

redis:
  # 数据源失效广播的订阅容器重试间隔。
  # 订阅容器刻意没有自动启动（自动启动会在容器刷新阶段同步连 Redis，
  # Redis 不可用时会把整个应用带崩，已实测），改由 RedisSubscriptionStarter
  # 在应用就绪后启动，失败就按这个间隔重试。
  subscriber-retry-ms: 30000

platform:
  # 管理员邀请码。注册时带上它才能拿到 ADMIN 角色。
  #
  # 留空（默认）= 关闭自助创建管理员，任何人都注册不出 ADMIN 账号。
  # ⚠️ 这是一个凭据，只从环境变量注入，不要写进配置文件、更不要提交进仓库。
  #
  # 为什么用邀请码而不是"把某个用户名写进配置"：后者可以被抢注 ——
  # 只要没人先注册那个名字，任何人都能注册它并直接拿到管理员权限。
  admin-register-code: ${ADMIN_REGISTER_CODE:}

  # 自然语言生成 SQL（NL2SQL）
  #
  # ⚠️ 默认关闭，而且必须由部署方显式打开。两个理由：
  #   1. 没配密钥就不该导致整个平台起不来 ——"接大模型"不能是硬依赖；
  #   2. 打开之后，**表结构会被发给模型服务**。这是一次真实的数据出境，
  #      必须有人为此签字，而不是应用擅自决定。
  #
  # 关闭时的表现是：入口明确返回"功能未启用，请配置 platform.llm.xxx"，
  # 而不是 500 或者空指针。见 DisabledLlmClient。
  #
  # 接口按 OpenAI 兼容协议（POST /chat/completions）调用，
  # 所以 DeepSeek / 通义 / Kimi / 本地 Ollama / vLLM 都只改 base-url 和 model 就能用。
  # 文旅、文物这类客户多半会要求模型私有化部署 —— 那时候要改的就是这一个 base-url。
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    # ⚠️ 这是一个凭据，只从环境变量注入，
    #    不要写进配置文件、更不要提交进仓库。
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    # 调用超时（秒）。必须有：这是一次同步的外部 HTTP 调用，占着 Web 线程。
    # 没有超时的话，上游卡住会把 Tomcat 线程池吃干，
    # 表现成"整个平台打不开"，而根因在别人家的服务上。
    timeout-seconds: 30

    # 单用户限流。比工单提交严得多：每一次都是一次**付费的外部调用**，
    # 而且最长会占用 30 秒的 Web 线程。不限流的话，一个人反复点
    # 就能把配额和线程一起烧掉。
    rate-limit:
      max-requests: 5
      window-seconds: 60

  sql-permission:
    # 角色 -> 允许执行的语句类型。
    # 不配就用代码里的默认值（见 SqlPermissionProperties）：
    #   USER  = SELECT
    #   ADMIN = SELECT, INSERT, UPDATE, DELETE
    # DDL 默认不在任何角色里 —— DROP TABLE 这类语句在本平台没有正当用途，
    # 要开必须在这里显式配置，而不是"因为是管理员所以顺手给了"。
    #
    # 配了这里就会**整体替换**默认值，不是合并：写少一个角色，
    # 那个角色的用户会立刻变成"什么都不能执行"（fail-closed）。
    #
    # role-whitelist:
    #   USER:  [SELECT]
    #   ADMIN: [SELECT, INSERT, UPDATE, DELETE]

    # 可以提交审核工单去申请执行的语句类型。
    #
    # ⚠️ 它**必须**和上面的 role-whitelist 分开，这是工单能不能成立的关键。
    # 直觉上会想"提交工单也用同一个白名单"，但那样会得到一个死循环：
    # USER 的白名单里只有 SELECT，于是 USER 连一条 UPDATE 的工单都提交不了 ——
    # 而"让没有写权限的人能够申请写操作"正是工单系统存在的理由。
    #
    # 三件事的边界：
    #   能不能申请      -> reviewable-types（这里），默认 INSERT / UPDATE / DELETE
    #   能不能直接执行  -> role-whitelist，走 QueryServiceImpl，与工单无关
    #   批了能不能执行  -> 由"审批人点了通过"授予，一次性、绑定到这一条 SQL 上
    #
    # DDL 默认不在里面，理由和 role-whitelist 一样：
    # DROP / TRUNCATE 不是"数据订正"，是结构变更，没有"审一下就能放行"的正当场景。
    #
    # 放宽的只是语句类型 —— 解析、AST 危险函数检查、系统库检查、字符串兜底
    # 这四道防线在提交和执行两处都不会少：可申请的是"写语句"，不是"危险语句"。
    #
    # reviewable-types: [INSERT, UPDATE, DELETE]

query:
  rate-limit:
    # 单用户每分钟允许执行的查询条数。
    # 原来写死 10 —— 实测会拦住正常使用（反复调试同一条 SQL 几十秒就会触顶），
    # 安全措施反而变成了功能故障。改成可配，默认放宽到 60。
    max-requests: 60
    window-seconds: 60

# 导出相关策略
export:
  # 超过保留天数的 CSV 会被定时任务删除，并把数据库里的路径置空
  file-retention-days: 7
  clean-cron: "0 0 3 * * ?"
  # 单次导出的行数上限。超过就直接让任务失败，而不是截断后返回成功 ——
  # 截断的 CSV 看起来是"完整的"，用户会以为数据齐了；报错至少让他知道要缩小范围。
  # 这个值必须存在：没有上限时，一条 select * from 大表 会把磁盘写满，
  # 而磁盘写满影响的是整台机器上的所有服务。
  max-rows: 100000

  # 单条导出 SQL 的执行超时（秒）。
  # 比查询链路的 30 秒宽（导出还要往磁盘写），但必须有 ——
  # 导出连接来自和查询共用的连接池（上限 5），一条挂住的慢 SQL 会把池子慢慢占满。
  query-timeout-seconds: 300

  # 超过这个时长还停在 PENDING / RUNNING 的任务会被补偿任务标记为失败。
  # ⚠️ 它和上面的 query-timeout-seconds 有约束关系：
  #    判定用的是 created_at（含排队时间），所以阈值 ≈ 执行上限 + 排队余量。
  #    300 秒执行 + 约 4 分钟排队余量 = 600 秒。
  #    调大 query-timeout-seconds 时必须同步调大这个值，否则会把正常执行的导出判成卡死。
  stuck-running-minutes: 10
  recovery-cron: "0 */5 * * * ?"

# SQL 审核工单（审批通过后异步执行的那条链路）
review:
  # 单条工单 SQL 的执行超时（秒）。
  # 比查询链路的 30 秒宽 —— 工单本来就是给"批量订正"用的；
  # 但必须有：它和查询共用同一个数据源连接池（上限 5），
  # 一条挂住的 UPDATE 会把池子慢慢占满，把正常查询一起拖垮。
  query-timeout-seconds: 120

  # 批准之后多久还没被执行，就重新投递一次执行消息。
  #
  # 为什么可以放心重投：消费者认领时要求状态仍是 APPROVED（条件更新），
  # 第一条消息认领成功后，后面重复的那些只会被 ack 掉，不会重复执行。
  # 这也正是 approve() 里"投递失败不报错、交给补偿任务"这个决定能成立的前提 ——
  # 没有这个兜底，那条被吞掉的异常就真的没人管了。
  stuck-approved-minutes: 10

  # 重投最多持续多久，超过就放弃并标记失败。
  # 没有这个上限的话，Broker 长期不可用会让补偿任务每 5 分钟重投一次、
  # 永远重投下去 —— 日志被刷满，却没有任何人注意到。
  stuck-approved-max-hours: 24

  # EXECUTING 停留超过这个时长就认定执行中断。
  # ⚠️ 它必须明显大于 query-timeout-seconds：
  #     2 分钟执行上限 + 13 分钟余量 = 15 分钟。
  #     调大 query-timeout-seconds 时必须同步调大这个值，
  #     否则会把仍在正常执行的工单判成失败。
  #
  # 卡在这一步的工单会被标记为失败，而**不会**自动重跑 ——
  # 写语句不幂等（UPDATE ... SET n = n + 1 跑两次就是两次），
  # 中断时"到底生效没有"无法确定。这个不确定性必须交给人，不能用一个"重试"消化掉。
  stuck-executing-minutes: 15

  recovery-cron: "0 */5 * * * ?"

  # 是否允许审批自己提交的工单。默认不允许。
  #
  # 这条链路存在的理由就是"由另一个人看过之后决定"，而它偏偏是全平台
  # 唯一一条执行人工写语句的路径。允许自批的话，对 ADMIN 来说工单就退化成了
  # 一次自我确认 —— 审批这一步就白设了。
  #
  # 但只有一名管理员的小团队确实需要放开，所以做成配置而不是写死。
  # 注意：驳回**不**受这个开关限制 —— 驳回自己的工单本质上就是「撤回」，
  # 禁止它只会让人被自己卡住，一条提错了的工单再也撤不掉。
  allow-self-approve: ${REVIEW_ALLOW_SELF_APPROVE:false}

  # 提交工单的单用户限流。
  # 比查询的 60 次/分钟更严：每提交一次，平台就会拿**业务库**的连接跑一次 EXPLAIN，
  # 而那个连接池上限只有 5。任意登录用户无成本连点，既能把别人的查询连接池占满，
  # 又能往工单表里灌垃圾。"谁都能申请"是对的（申请不改数据），
  # 但"谁都能无限量申请"不是。
  rate-limit:
    max-requests: 20
    window-seconds: 60
jwt:
  
  secret: ${JWT_SECRET}
  expire-days: 7
aes:
  # ---- 密钥版本化 ----
  # 密文格式：{版本号}:{Base64(...)}，例如 v2:xxxx
  # 加密永远用 current-key-version；解密按密文里带的版本号选密钥。
  #
  # 只配 key（不配 keys）时行为与改造前完全一致 —— 现有部署不需要改任何配置。
  current-key-version: ${AES_KEY_VERSION:v1}
  key: ${AES_KEY:}

  # 历史密钥：版本号 -> 密钥，只用于解密。
  # 轮换时把老密钥放这里，新密钥放上面的 key，再把 current-key-version 指到新版本：
  #   current-key-version: v2
  #   key: <新密钥>
  #   keys:
  #     v1: <老密钥>
  # 这样新数据用新密钥、老数据仍然解得开，轮换是可以分步做的。
  #
  # ⚠️ 不配 keys 时不要写 "keys: {}"。
  # 空的 flow map 会被 Spring Boot 摊平成「aes.keys="空字符串"」这一个属性，
  # 再往 Map<String,String> 字段上绑定时会直接报
  #   ConverterNotFoundException: No converter found capable of converting
  #   from type [java.lang.String] to type [java.util.Map]
  # 应用起不来。不写这一项即可 —— Java 字段本身就是空 Map。

  # 历史 ECB 密文（没有版本前缀的那种）用哪个版本的密钥解。
  # 本项目引入 GCM 时的密钥版本就是 v1，在那之前产生的密文用的也是同一个密钥。
  legacy-key-version: v1

  # 启动时把存量密码重新加密到当前版本。默认关闭 ——
  # 它会改写所有数据源密码，属于有破坏性的批量操作，应该由人显式触发。
  # 幂等：已经是当前版本的记录会被跳过，可以安全地重复执行。
  # 用法：轮换时临时置为 true 启动一次，确认日志里的迁移条数后改回 false。
  reencrypt-on-startup: ${AES_REENCRYPT_ON_STARTUP:false}

