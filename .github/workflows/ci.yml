name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 编译 + 单元测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 单元测试不依赖 MySQL / Redis / RabbitMQ；
      # 需要中间件的用例打了 integration 标签，由 surefire 默认排除。
      # 本地执行集成测试：docker compose up -d && mvn test -Dgroups=integration
      #
      # ⚠️ 用 verify 而不是 test：verify 会一并跑 maven-enforcer 的检查
      #    （JDK / Maven 版本、依赖收敛）。这类问题在本地往往「能跑」，
      #    只在换机器或升级依赖时才以诡异的 NoSuchMethodError 暴露出来。
      #    --no-transfer-progress：让 CI 日志里只剩有意义的部分。
      - name: 编译并运行单元测试（含构建环境检查）
        run: mvn -B --no-transfer-progress verify
