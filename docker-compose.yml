version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sql-query-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: sql_query_platform
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: sql-query-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sql-query-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build: .
    container_name: sql-query-app
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: MyJwtSecretKey1234567890
      AES_KEY: SqlQueryPlatform123
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "8080:8080"
