version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sql-query-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: sql_query_platform
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: sql-query-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sql-query-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build: .
    container_name: sql-query-app
    depends_on:
      - mysql
      - redis
      - rabbitmq
    # ⚠️ 以下凭据仅用于本地一键起演示环境，不要用于任何真实部署。
    #    生产环境必须替换为强随机值，并通过密钥管理服务注入。
    #    AES_KEY 的长度必须是 16 / 24 / 32 字符 —— 这是 AES 的算法约束，
    #    长度不对时应用在加解密数据源密码时会直接失败。
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: LocalDemoJwtSecretKeyChangeMe1234567890
      AES_KEY: SqlQueryPlatformDemoKey32Bytes!!
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "8080:8080"
