# 不再写 version：Compose V2 已经忽略顶层 version 字段，保留它只会在每次
# docker compose 命令上打印一条 "the attribute version is obsolete" 告警。
services:
  mysql:
    image: mysql:8.0
    container_name: sql-query-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: sql_query_platform
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # PostgreSQL：多方言支持的验证环境。
  # 它是"另一种方言"的活样本 —— 连接串前缀、驱动、默认端口、
  # 危险函数名单、系统库名单、专有语法（$$ 引用、:: 转换）全都和 MySQL 不一样。
  postgres:
    image: postgres:16-alpine
    container_name: sql-query-postgres
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sql_query_platform_demo
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: sql-query-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sql-query-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    # ⚠️ 没有这个卷的话，容器一重建，**队列定义和还没被消费的消息全部消失**。
    #    对本项目来说后果是具体的：死信队列里那些"处理失败、需要人工查看"的消息
    #    会跟着一起没掉 —— 而它们是排查故障的唯一线索。
    #    （RabbitMQ 的队列默认是 durable 的，所以卷挂上之后消息本身就落盘了。）
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  app:
    build: .
    container_name: sql-query-app
    depends_on:
      - mysql
      - redis
      - rabbitmq
    # ⚠️ 以下凭据仅用于本地一键起演示环境，不要用于任何真实部署。
    #    生产环境必须替换为强随机值，并通过密钥管理服务注入。
    #    AES_KEY 的长度必须是 16 / 24 / 32 字符 —— 这是 AES 的算法约束，
    #    长度不对时应用在加解密数据源密码时会直接失败。
    environment:
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: LocalDemoJwtSecretKeyChangeMe1234567890
      AES_KEY: SqlQueryPlatformDemoKey32Bytes!!
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "8080:8080"

# 具名卷：让 RabbitMQ / 数据库的数据在容器重建后还在
volumes:
  rabbitmq-data:

